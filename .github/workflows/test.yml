name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check install scripts
        run: |
          bash -n scripts/install.sh
          sh -n scripts/docker-entrypoint.sh
          if grep -E 'opencode\.ai/install|\bcurl\b|\bbash\b' scripts/docker-entrypoint.sh; then
            echo "entrypoint must not download or execute a remote installer" >&2
            exit 1
          fi
      - name: Entrypoint fails closed without a seeded OpenCode binary
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export OPENCODE_HOME="$tmp/home"
          export OPENCODE_BIN="$tmp/home/.opencode/bin/opencode"
          export WORKSPACE_ROOT="$tmp/ws"
          if err=$(sh scripts/docker-entrypoint.sh true 2>&1); then
            echo "expected missing binary to fail" >&2
            exit 1
          fi
          printf '%s\n' "$err" | grep -F './scripts/install.sh'
          printf '%s\n' "$err" | grep -F -- '--upgrade-opencode'
          mkdir -p "$(dirname "$OPENCODE_BIN")"
          printf '#!/bin/sh\necho 1.2.3\n' > "$OPENCODE_BIN"
          chmod 755 "$OPENCODE_BIN"
          sh scripts/docker-entrypoint.sh true
          if err=$(OPENCODE_VERSION=9.9.9 sh scripts/docker-entrypoint.sh true 2>&1); then
            echo "expected version mismatch to fail" >&2
            exit 1
          fi
          printf '%s\n' "$err" | grep -F './scripts/install.sh'
          OPENCODE_VERSION=1.2.3 sh scripts/docker-entrypoint.sh true
          OPENCODE_VERSION=v1.2.3 sh scripts/docker-entrypoint.sh true
      - name: Installer writes env and Compose config
        run: |
          openssl genrsa -out /tmp/app.pem 2048
          GITHUB_APP_ID=1 \
          GITHUB_WEBHOOK_SECRET=secret \
          GITHUB_APP_PRIVATE_KEY_PATH=/tmp/app.pem \
          UI_PASSWORD=pass \
          UI_SESSION_SECRET=sessionsecret0123456789abcdef \
          OPENCODE_REVIEWER_MODEL=anthropic/claude-sonnet-4-5 \
          ANTHROPIC_API_KEY=sk-test \
          ./scripts/install.sh --non-interactive --skip-start --force
          grep -F 'OPENCODE_BIN="/opt/opencode/.opencode/bin/opencode"' .env
          grep -F 'GITHUB_APP_PRIVATE_KEY_PATH="/run/secrets/github-app.pem"' .env
          test -f github-app.pem
          # The installer must leave the PEM readable by container uid 1000 and
          # never group/other-writable: 400 on chown, 640 after an ACL grant
          # (group bits hold the ACL mask), 404 as the last-resort fallback.
          mode=$(stat -c '%a' github-app.pem)
          case "$mode" in 400|404|440|600|640) ;; *) echo "unexpected github-app.pem mode: $mode" >&2; exit 1 ;; esac
          test $((8#$(stat -c '%a' github-app.pem) % 8 % 2)) -eq 0
          test $((8#$(stat -c '%a' github-app.pem) / 8 % 2)) -eq 0
          if [[ "$(id -u)" == "0" || "$(id -u)" == "1000" ]]; then
            test "$(stat -c '%u:%g' github-app.pem)" = "1000:1000"
            test "$mode" = "400"
          fi
          grep -F 'chown 1000:1000' scripts/install.sh
          chmod 600 github-app.pem
          if [[ "$(id -u)" != "0" && "$(id -u)" != "1000" ]]; then
            err=$(./scripts/install.sh --non-interactive --skip-start 2>&1)
            printf '%s\n' "$err" | grep -E 'granted container uid 1000 read via ACL|set mode 404 \(other-read\)'
          else
            ./scripts/install.sh --non-interactive --skip-start
          fi
          test -f docker-compose.override.yml
          docker compose config >/dev/null
