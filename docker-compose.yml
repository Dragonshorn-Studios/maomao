name: maomao

services:
  maomao:
    build: .
    ports:
      - "${MAOMAO_PORT:-3000}:3000"
    env_file:
      - .env
    # Trusted checks run bubblewrap inside the container. Docker's default
    # seccomp/AppArmor confinement blocks the nested namespace/mount operations
    # even though the service itself runs as the unprivileged node user.
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    environment:
      DATABASE_PATH: /data/maomao.sqlite
      WORKSPACE_ROOT: /data/workspaces
      HOME: /opt/opencode
      OPENCODE_BIN: /opt/opencode/.opencode/bin/opencode
    volumes:
      - maomao-data:/data
      - maomao-opencode:/opt/opencode
      # scripts/install.sh bind-mounts ./github-app.pem via docker-compose.override.yml
      # - ./github-app.pem:/run/secrets/github-app.pem:ro
    restart: unless-stopped

volumes:
  maomao-data:
  maomao-opencode:
