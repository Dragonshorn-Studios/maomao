name: Test

on:
  push:
    branches: [main]
  pull_request:

# pull-requests/checks are needed by the Elyseum coverage reporter step.
permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Full history: Elyseum's diff-coverage resolves origin/main and needs
      # the merge-base, which a depth-1 checkout doesn't have.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # test:report = vitest run with coverage (lcov) and a JSON report,
      # both consumed by the Elyseum steps below.
      - run: npm run test:report
      # Elyseum: PR diff-coverage comment + quality-gate check run + upload.
      # The action only supports pull_request events (it comments on the PR).
      # Pinned to the unmerged rework branch: every released tag (@v1,
      # v1.0.15) still has the multi-line $GITHUB_OUTPUT parse bug and no
      # upload support. TODO: pin the released tag once the PR #3/#4/#5
      # stack merges.
      - name: Report diff coverage to Elyseum
        if: github.event_name == 'pull_request'
        uses: Dragonshorn-Studios/elyseum-coverage-reporter-action@14-contract-docs
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          command: diff-coverage
          # npm 1.0.12 was published from a stale build (no emit-envelope);
          # 1.1.0 omitted per-file percent rounding (host rejects with 422);
          # 1.1.1 omitted run timestamps (runs stayed "in progress");
          # 1.1.2's diff parsing crashes on some file content (exit 5);
          # 1.1.3 crashed diff parsing on some content; 1.1.4 records real branch
          # names (CI checkouts reported "HEAD").
          elyseum-cli-version: "1.1.4"
          quality-gate: "60"
          quality-gate-fail: "15"
          elyseum-server: https://elyseum.dragonshorn.cloud
          elyseum-project-slug: maomao
          elyseum-ingest-token: ${{ secrets.ELYSIUM_INGEST_TOKEN }}
          envelope-tests-format: vitest-json
          envelope-tests-input: coverage/vitest.json
          envelope-coverage-format: lcov
          envelope-coverage-input: coverage/lcov.info
      # Elyseum: main pushes can't use the action (no PR to comment on), so
      # emit the envelope and upload it directly — this keeps ledger history
      # continuous between merges.
      - name: Report main run to Elyseum
        if: github.event_name == 'push'
        env:
          ELYSIUM_INGEST_TOKEN: ${{ secrets.ELYSIUM_INGEST_TOKEN }}
        run: |
          npm install -g @dragonshorn-studios/elyseum-cli@1.1.4
          elyseum-cli emit-envelope \
            --emit-envelope.tests-format vitest-json \
            --emit-envelope.tests-input coverage/vitest.json \
            --emit-envelope.coverage-format lcov \
            --emit-envelope.coverage-input coverage/lcov.info \
            --emit-envelope.out envelope.json
          curl -sS -f -X POST \
            -H "Authorization: Bearer $ELYSIUM_INGEST_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @envelope.json \
            "https://elyseum.dragonshorn.cloud/api/v1/projects/maomao/runs"
      - run: npm run build
      # `npm run build` typechecks the app; this covers the chat island and
      # the Playwright suite, which no build project includes.
      - run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      # The dev-only UI workbench boots on its own: no .env, no database, no
      # GitHub, no OpenCode. The Playwright config starts it.
      - name: Run UI workbench smoke test
        run: npm run test:e2e
      - name: Upload workbench screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-workbench-screenshots
          path: test-results/
          if-no-files-found: ignore
      - name: Check install scripts
        run: |
          bash -n scripts/install.sh
          sh -n scripts/docker-entrypoint.sh
          if grep -E 'opencode\.ai/install|\bcurl\b|\bbash\b' scripts/docker-entrypoint.sh; then
            echo "entrypoint must not download or execute a remote installer" >&2
            exit 1
          fi
      - name: Entrypoint fails closed without a seeded OpenCode binary
        run: |
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          export OPENCODE_HOME="$tmp/home"
          export OPENCODE_BIN="$tmp/home/.opencode/bin/opencode"
          export WORKSPACE_ROOT="$tmp/ws"
          if err=$(sh scripts/docker-entrypoint.sh true 2>&1); then
            echo "expected missing binary to fail" >&2
            exit 1
          fi
          printf '%s\n' "$err" | grep -F './scripts/install.sh'
          printf '%s\n' "$err" | grep -F -- '--upgrade-opencode'
          mkdir -p "$(dirname "$OPENCODE_BIN")"
          printf '#!/bin/sh\necho 1.2.3\n' > "$OPENCODE_BIN"
          chmod 755 "$OPENCODE_BIN"
          sh scripts/docker-entrypoint.sh true
          if err=$(OPENCODE_VERSION=9.9.9 sh scripts/docker-entrypoint.sh true 2>&1); then
            echo "expected version mismatch to fail" >&2
            exit 1
          fi
          printf '%s\n' "$err" | grep -F './scripts/install.sh'
          OPENCODE_VERSION=1.2.3 sh scripts/docker-entrypoint.sh true
          OPENCODE_VERSION=v1.2.3 sh scripts/docker-entrypoint.sh true
      - name: Installer writes env and Compose config
        run: |
          openssl genrsa -out /tmp/app.pem 2048
          GITHUB_APP_ID=1 \
          GITHUB_WEBHOOK_SECRET=secret \
          GITHUB_APP_PRIVATE_KEY_PATH=/tmp/app.pem \
          UI_PASSWORD=pass \
          UI_SESSION_SECRET=sessionsecret0123456789abcdef \
          OPENCODE_REVIEWER_MODEL=anthropic/claude-sonnet-4-5 \
          ANTHROPIC_API_KEY=sk-test \
          ./scripts/install.sh --non-interactive --skip-start --force
          grep -F 'OPENCODE_BIN="/opt/opencode/.opencode/bin/opencode"' .env
          grep -F 'GITHUB_APP_PRIVATE_KEY_PATH="/run/secrets/github-app.pem"' .env
          test -f github-app.pem
          # The installer must leave the PEM readable by container uid 1000 and
          # never group/other-writable: 400 on chown, 640 after an ACL grant
          # (group bits hold the ACL mask), 404 as the last-resort fallback.
          mode=$(stat -c '%a' github-app.pem)
          case "$mode" in 400|404|440|600|640) ;; *) echo "unexpected github-app.pem mode: $mode" >&2; exit 1 ;; esac
          test $((8#$(stat -c '%a' github-app.pem) % 8 % 2)) -eq 0
          test $((8#$(stat -c '%a' github-app.pem) / 8 % 2)) -eq 0
          if [[ "$(id -u)" == "0" || "$(id -u)" == "1000" ]]; then
            test "$(stat -c '%u:%g' github-app.pem)" = "1000:1000"
            test "$mode" = "400"
          fi
          grep -F 'chown 1000:1000' scripts/install.sh
          chmod 600 github-app.pem
          if [[ "$(id -u)" != "0" && "$(id -u)" != "1000" ]]; then
            err=$(./scripts/install.sh --non-interactive --skip-start 2>&1)
            printf '%s\n' "$err" | grep -E 'granted container uid 1000 read via ACL|set mode 404 \(other-read\)'
          else
            ./scripts/install.sh --non-interactive --skip-start
          fi
          test -f docker-compose.override.yml
          docker compose config >/dev/null
